<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuffle</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --table: #c9c6bf; --plastic: #161616; --plastic-edge: #3a3a3a; --floor: #050505;
    --cream: #efe6cf; --cream-hi: #fbf6e8; --cream-lo: #cfc3a4; --ink: #1c1a17; --print: #f5f5f2;
    --gap: 3px; --gutter: 16px; --frame-pad: 20px; --panel: 132px; --well-pad: 5px;
    /* smallest tile the height rule may shrink to */
    --tile-floor: 24px;
    /* vertical space outside the board (page padding, frame, status, buttons, message); tiles shrink to fit the viewport height */
    --vchrome: 240px;
    /* horizontal space inside the body's content box that is not tiles or gaps */
    --chrome: calc(2 * var(--frame-pad) + var(--panel) + 2 * var(--well-pad));
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px var(--gutter); min-height: 100vh;
    container-type: inline-size; /* 100cqi = content width, excluding any classic scrollbar */
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    font-family: system-ui, sans-serif; color: var(--ink);
    background-color: var(--table);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.18), transparent 60%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.06), transparent 55%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.015) 0 2px, transparent 2px 5px);
  }
  .frame {
    display: flex; align-items: stretch; max-width: 100%;
    padding: var(--frame-pad); border-radius: 14px;
    background: linear-gradient(160deg, #242424, var(--plastic) 40%, #101010);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), inset 0 0 0 1px var(--plastic-edge),
                0 10px 24px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.3);
  }
  .well {
    padding: var(--well-pad); background: var(--floor); border-radius: 3px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.08);
  }
  .panel { width: var(--panel); padding-left: 14px; display: flex; flex-direction: column; justify-content: space-between; color: var(--print); }
  .brand {
    margin: 0; color: var(--print); white-space: nowrap;
    font: italic 700 1.9rem/1.1 "Segoe Script", "Brush Script MT", "Snell Roundhand", "Apple Chancery", cursive;
    transform: rotate(-6deg); transform-origin: left center;
  }
  .note { margin: 0; font-size: 0.8rem; line-height: 1.25; color: var(--print); }
  #board {
    --tile: min(64px,
      calc((100cqi - var(--chrome) - (var(--cols, 3) - 1) * var(--gap)) / var(--cols, 3)),
      max(var(--tile-floor), calc((100svh - var(--vchrome) - (var(--rows, 3) - 1) * var(--gap)) / var(--rows, 3))));
    display: grid; gap: var(--gap);
    grid-template-columns: repeat(var(--cols, 3), var(--tile)); grid-auto-rows: var(--tile);
  }
  .tile {
    width: var(--tile); height: var(--tile); padding: 0; border: none; border-radius: 3px; cursor: pointer;
    font-family: "Arial Rounded MT Bold", "Arial Rounded MT", ui-rounded, "Nunito", "Trebuchet MS", system-ui, sans-serif;
    font-weight: 700; font-size: calc(var(--tile) * 0.45); color: var(--ink);
    background: linear-gradient(145deg, var(--cream-hi), var(--cream) 45%, #e4d9bd);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.8), inset -1px -1px 0 rgba(0,0,0,0.18),
                inset 0 0 0 1px var(--cream-lo), 0 1px 1px rgba(0,0,0,0.5);
  }
  .tile:hover { filter: brightness(1.04); }
  .tile.empty { background: var(--floor); box-shadow: inset 0 1px 3px rgba(0,0,0,0.9); cursor: default; filter: none; }
  .status { display: flex; gap: 24px; font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile.image { position: relative; overflow: hidden; background: var(--floor); box-shadow: 0 1px 1px rgba(0,0,0,0.5); }
  .tile.image canvas { display: block; width: 100%; height: 100%; }
  .tile.image::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4), inset -1px -1px 0 rgba(0,0,0,0.3);
  }
  .size { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 24px; font-size: 1.05rem; font-weight: 600; color: var(--ink); }
  .size select, dialog .preset select {
    font: inherit; margin-left: 4px; padding: 4px 8px; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(#2a2a2a, #121212); color: var(--print);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 2px 4px rgba(0,0,0,0.3);
  }
  .size option, dialog .preset option { background: #1a1a1a; color: var(--print); }
  #shuffle, #new, #flip, dialog button {
    padding: 10px 26px; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(#2a2a2a, #121212); color: var(--print);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 2px 4px rgba(0,0,0,0.3);
  }
  #shuffle:hover:not(:disabled), #new:hover:not(:disabled), #flip:hover, dialog button:hover { background: linear-gradient(#333, #1a1a1a); }
  dialog button { padding: 8px 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 0 0 1px var(--plastic-edge); }
  dialog button:disabled { opacity: 0.5; cursor: default; }
  .actions { display: flex; gap: 12px; }
  #shuffle:disabled, #new:disabled { opacity: 0.45; cursor: default; }
  .actions .sep { width: 1px; align-self: stretch; margin: 4px 6px; background: rgba(0,0,0,0.35); }
  .plate {
    position: relative; max-width: 100%;
    transform: perspective(1200px) rotateY(0deg); transform-style: preserve-3d; transition: transform 0.6s ease-in-out;
  }
  .plate.flipped { transform: perspective(1200px) rotateY(180deg); }
  .frame, .back { backface-visibility: hidden; }
  .back {
    position: absolute; inset: 0; transform: rotateY(180deg); overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    padding: 14px 28px 10px 14px; border-radius: 14px; color: var(--print);
    background: linear-gradient(200deg, #242424, var(--plastic) 40%, #101010);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), inset 0 0 0 1px var(--plastic-edge),
                0 10px 24px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.3);
  }
  #back-picture, #back-grid { flex: none; }
  #back-picture[hidden], #back-grid[hidden] { display: none; }
  #back-grid { display: grid; gap: 1px; padding: 1px; background: #8a8a8a; }
  .back-cell {
    display: flex; align-items: center; justify-content: center; background: #e6e6e6; color: #1a1a1a;
    font-family: "Arial Rounded MT Bold", "Arial Rounded MT", ui-rounded, "Nunito", "Trebuchet MS", system-ui, sans-serif; font-weight: 700;
  }
  .back-cell.empty { background: #1a1a1a; }
  .back-caption {
    flex: none; margin: 0; text-align: center; font-size: 0.8rem; font-weight: 700; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  .back-maker { position: absolute; right: 8px; top: 30px; margin: 0; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 0.55rem; white-space: nowrap; }
  .back-mark {
    position: absolute; top: 10px; right: 7px; width: 14px; height: 14px; border: 1px solid var(--print); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 0.5rem; font-weight: 700; line-height: 1;
  }
  dialog {
    width: min(440px, calc(100% - 32px)); padding: 20px; border: none; border-radius: 14px;
    background: linear-gradient(160deg, #242424, var(--plastic) 40%, #101010); color: var(--print); color-scheme: dark;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), inset 0 0 0 1px var(--plastic-edge),
                0 10px 24px rgba(0,0,0,0.35), 0 2px 4px rgba(0,0,0,0.3);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
  dialog .size, dialog label, dialog legend, dialog .hint, dialog h2 { color: var(--print); }
  dialog h2 { margin: 0 0 12px; font: italic 700 1.5rem/1.1 "Segoe Script", "Brush Script MT", "Snell Roundhand", "Apple Chancery", cursive; }
  dialog .hint { margin: 0 0 12px; font-size: 0.9rem; }
  dialog .size { margin-bottom: 14px; justify-content: flex-start; }
  dialog fieldset { margin: 0 0 14px; padding: 8px 12px; border: 1px solid var(--plastic-edge); border-radius: 8px; display: flex; gap: 18px; }
  dialog fieldset label { font-weight: 600; }
  dialog input[type="radio"], dialog input[type="range"] { accent-color: var(--cream); }
  dialog .file { display: block; margin-bottom: 12px; font-weight: 600; }
  dialog .file input { display: block; margin-top: 6px; max-width: 100%; }
  dialog .file[hidden] { display: none; }
  dialog .preset select { display: block; margin-left: 0; margin-top: 6px; max-width: 100%; }
  dialog .zoom { display: flex; align-items: center; gap: 10px; margin: 12px 0; font-weight: 600; }
  dialog .zoom input { flex: 1; min-width: 0; }
  #crop-view { display: block; margin: 0 auto; touch-action: none; cursor: grab; border-radius: 3px; background: var(--floor); }
  #new-preview { display: block; margin: 0 auto 12px; border-radius: 3px; background: var(--floor); }
  #new-preview[hidden] { display: none; }
  #new-error { margin: 0 0 12px; color: #ffb4a8; font-weight: 600; }
  .dialog-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; }
  #message { min-height: 1.5em; font-size: 1.2rem; font-weight: 700; color: var(--ink); }
  #message[hidden] { display: none; }
  /* Narrow screens: drop the side panel and print the title strip above the well instead. */
  @media (max-width: 559px) {
    :root { --frame-pad: 14px; --panel: 0px; --vchrome: 266px; }
    .frame { flex-direction: column-reverse; }
    .well { align-self: center; }
    .panel { width: auto; padding: 0 0 10px; flex-direction: row; align-items: flex-end; justify-content: space-between; gap: 10px; }
    .brand { font-size: 1.6rem; }
    .note { font-size: 0.7rem; text-align: right; max-width: 11em; }
  }
  @media (prefers-reduced-motion: reduce) { .plate { transition: none; } }
</style>
</head>
<body>
<div class="plate" id="plate">
<div class="frame" id="frame">
  <div class="well"><div id="board"></div></div>
  <div class="panel">
    <h1 class="brand">Shuffle</h1>
    <p class="note">Click a tile next to the gap to slide it.</p>
  </div>
</div>
<div class="back" id="back" inert>
  <canvas id="back-picture" hidden></canvas>
  <div id="back-grid" hidden></div>
  <p class="back-caption" id="back-caption"></p>
  <p class="back-maker">Made by SHUFFLE</p>
  <span class="back-mark" aria-hidden="true">S</span>
</div>
</div>
<div class="status">
  <span id="moves">Moves: 0</span>
  <span id="timer">Time: 0s</span>
</div>
<div class="actions">
  <button id="new" type="button">New</button>
  <button id="shuffle" type="button">Shuffle</button>
  <span class="sep" aria-hidden="true"></span><button id="flip" type="button" aria-pressed="false">Flip</button>
</div>
<div id="message" hidden>You solved it!</div>
<dialog id="new-dialog" aria-labelledby="new-title">
  <h2 id="new-title">New puzzle</h2>
  <div class="size">
    <label>Rows <select id="rows" autocomplete="off"></select></label>
    <label>Columns <select id="cols" autocomplete="off"></select></label>
  </div>
  <fieldset class="kind"><legend>Tiles</legend>
    <label><input type="radio" name="kind" id="kind-numbers" value="numbers" checked> Numbers</label>
    <label><input type="radio" name="kind" id="kind-image" value="image"> Image</label>
  </fieldset>
  <label class="file preset" id="preset-row" hidden>Picture <select id="preset" autocomplete="off"><option value="">Choose a picture</option></select></label>
  <p id="preset-note" class="hint" hidden></p>
  <label class="file">Image file <input type="file" id="image-file" accept="image/*"></label>
  <canvas id="new-preview" hidden aria-label="Preview: the picture with the grid it will be cut into"></canvas>
  <p id="new-error" role="alert" hidden></p>
  <div class="dialog-actions">
    <button id="new-cancel" type="button">Cancel</button>
    <button id="new-start" type="button">Start</button>
  </div>
</dialog>
<dialog id="crop-dialog" aria-labelledby="crop-title">
  <h2 id="crop-title">Position your image</h2>
  <p class="hint">Drag to move it. Use the slider to zoom.</p>
  <canvas id="crop-view" tabindex="0" aria-label="Image crop. Drag, or use the arrow keys, to move the image."></canvas>
  <label class="zoom">Zoom <input type="range" id="crop-zoom" min="1" max="4" step="0.01" value="1"></label>
  <div class="dialog-actions">
    <button id="crop-centre" type="button">Centre</button>
    <button id="crop-cancel" type="button">Cancel</button>
    <button id="crop-done" type="button">Done</button>
  </div>
</dialog>
<script>
let rows = 3;
let cols = 3;
let tiles = [1, 2, 3, 4, 5, 6, 7, 8, 0]; // 0 is the empty space
let moves = 0;
let seconds = 0;
let timerId = null;
let frozen = false;
let image = null; // ImageBitmap of the current image puzzle, or null for numbers
let pieces = null; // pieces[v] = canvas for tile v, or null for numbers
let crop = null; // open crop modal: { bmp, name, rows, cols, z, cx, cy, vw, vh }
let decodeId = 0; // generation token for the pending decode in the New dialog
let listId = 0; // generation token for the pending images/ listing in the New dialog
let dragFrom = null; // last pointer position while dragging the crop view, or null
let range = null; // sizes offered in the New dialog: { rows: { min, max }, cols: { min, max } }
let flipped = false; // true while the back of the board is showing
let picture = null; // crop rectangle { sx, sy, cw, ch } of image, painted whole on the back
let caption = ''; // back caption of the current image puzzle: the preset or file name
let preview = null; // picture chosen in the open New dialog, loaded for the preview: { img, url }, or null
let previewId = 0; // generation token for the pending preview load
let previewStatus = 'none'; // load state of the picked picture: none, loading, ready or failed
let sized = false; // true once the player changed Rows or Columns in the open New dialog

// Rebuild the board DOM and counters from the current state, then check for a win.
function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  board.style.setProperty('--cols', cols);
  board.style.setProperty('--rows', rows);
  tiles.forEach((value, i) => {
    const btn = document.createElement('button');
    btn.className = value === 0 ? 'tile empty' : 'tile';
    btn.dataset.index = i;
    if (value !== 0 && pieces) {
      btn.classList.add('image');
      btn.setAttribute('aria-label', 'Tile ' + value);
      btn.appendChild(pieces[value]);
    } else {
      btn.textContent = value === 0 ? '' : value;
    }
    board.appendChild(btn);
  });
  document.getElementById('moves').textContent = 'Moves: ' + moves;
  document.getElementById('timer').textContent = 'Time: ' + seconds + 's';
  checkWin();
}

// Slide the tile at index into the empty space if it is orthogonally adjacent.
function move(index) {
  const empty = tiles.indexOf(0);
  if (index === empty) return;
  const rowDiff = Math.abs(Math.floor(index / cols) - Math.floor(empty / cols));
  const colDiff = Math.abs((index % cols) - (empty % cols));
  const adjacent = (rowDiff === 0 && colDiff === 1) || (colDiff === 0 && rowDiff === 1);
  if (!adjacent) return;
  [tiles[index], tiles[empty]] = [tiles[empty], tiles[index]];
  moves++;
  if (timerId === null && !frozen) startTimer();
  render();
}

// Start a new game at r rows by c columns: solved board, moves and timer reset, timer stopped.
function setSize(r, c) {
  rows = r;
  cols = c;
  tiles = [];
  for (let i = 1; i < r * c; i++) tiles.push(i);
  tiles.push(0);
  clearInterval(timerId);
  timerId = null;
  moves = 0;
  seconds = 0;
  frozen = false;
  render();
}

// Randomly reorder the tiles (Fisher-Yates) until the board is solvable and not already solved,
// then reset moves, timer and the frozen flag.
function shuffle() {
  do {
    for (let i = tiles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
    }
  } while (!isSolvable(tiles, cols) || isSolved());
  clearInterval(timerId);
  timerId = null;
  moves = 0;
  seconds = 0;
  frozen = false;
  render();
}

// Return true if the tile order (0 = empty) can be reached by sliding, for a board `cols` wide:
// count inversions among the numbered tiles; on even-width boards also add the empty space's row distance from the bottom.
function isSolvable(arr, cols) {
  const rows = arr.length / cols;
  const nums = arr.filter((v) => v !== 0);
  let inversions = 0;
  for (let i = 0; i < nums.length; i++) {
    for (let j = i + 1; j < nums.length; j++) if (nums[i] > nums[j]) inversions++;
  }
  const emptyRowFromBottom = rows - 1 - Math.floor(arr.indexOf(0) / cols);
  return (inversions + (cols % 2 === 0 ? emptyRowFromBottom : 0)) % 2 === 0;
}

// Return true if the tiles are in order 1..n with the empty space last.
function isSolved() {
  return tiles.every((value, i) => value === (i === tiles.length - 1 ? 0 : i + 1));
}

// Show the win message and freeze the timer only when the player has solved the board (at least one move).
function checkWin() {
  const solved = isSolved();
  const won = solved && moves > 0;
  document.getElementById('message').hidden = !won;
  if (won) {
    clearInterval(timerId);
    timerId = null;
    frozen = true;
  }
}

// Start the one-second timer, clearing any previous interval first.
function startTimer() {
  clearInterval(timerId);
  timerId = setInterval(() => {
    seconds++;
    document.getElementById('timer').textContent = 'Time: ' + seconds + 's';
  }, 1000);
}

document.getElementById('board').addEventListener('click', (e) => {
  const tile = e.target.closest('.tile');
  if (tile) move(Number(tile.dataset.index));
});
document.getElementById('shuffle').addEventListener('click', shuffle);

const $ = (id) => document.getElementById(id);
const newDialog = $('new-dialog');
const cropDialog = $('crop-dialog');
const cropView = $('crop-view');
const cropZoom = $('crop-zoom');

// Show the New puzzle dialog, prefilled with the current size and tile kind, and list the preset pictures.
function openNew() {
  $('rows').value = String(rows);
  $('cols').value = String(cols);
  $(image ? 'kind-image' : 'kind-numbers').checked = true;
  $('image-file').value = '';
  $('new-error').hidden = true;
  $('new-start').disabled = false;
  newDialog.showModal();
  sized = false;
  loadPresets();
  loadPreview();
}

// Start the puzzle chosen in the New dialog: numbers at once, an image via the crop dialog.
function startNew() {
  sized = true;
  const r = Number($('rows').value);
  const c = Number($('cols').value);
  const file = $('image-file').files[0];
  const error = (text) => { $('new-error').textContent = text; $('new-error').hidden = false; };
  $('new-error').hidden = true;
  if (!$('kind-image').checked) {
    newDialog.close();
    if (image) image.close();
    image = null;
    pieces = null;
    setSize(r, c);
  } else if ($('preset').value) {
    const id = ++decodeId;
    const name = $('preset').selectedOptions[0].textContent;
    $('new-start').disabled = true;
    presetBlob($('preset').value)
      .then((b) => createImageBitmap(b))
      .then((bmp) => onDecoded(bmp, id, r, c, name), () => onRejected(id));
  } else if (!file && image) {
    newDialog.close();
    openCrop(image, r, c, caption);
  } else if (!file) {
    error('Choose an image file.');
  } else {
    const id = ++decodeId;
    $('new-start').disabled = true;
    createImageBitmap(file).then((bmp) => onDecoded(bmp, id, r, c, file.name.replace(/\.[^.]+$/, '') || 'Your picture'), () => onRejected(id));
  }
}

// Fetch the images/ listing for the open New dialog (HTTP pages only) and fill the Picture select.
function loadPresets() {
  const id = ++listId;
  const sel = $('preset');
  sel.length = 1;
  sel.value = '';
  $('preset-row').hidden = true;
  $('preset-note').hidden = true;
  if (location.protocol !== 'http:' && location.protocol !== 'https:') {
    $('preset-note').textContent = 'Preset pictures need Shuffle served over HTTP (see README).';
    $('preset-note').hidden = false;
    return;
  }
  fetch('images/', { cache: 'no-store', redirect: 'error' })
    .then((res) => (res.ok ? res.text().then((t) => parseListing(t, res.url)) : []))
    .then((list) => onListed(list, id), () => onListed([], id));
}

// Return [{ name, url }] for the recognised image links directly inside images/ in a listing page.
function parseListing(html, base) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const dir = new URL('images/', location.href);
  const seen = new Set();
  const out = [];
  doc.querySelectorAll('a[href]').forEach((a) => {
    let u;
    try { u = new URL(a.getAttribute('href'), base); } catch (e) { return; }
    if (u.origin !== location.origin || !u.pathname.startsWith(dir.pathname)) return;
    const rest = u.pathname.slice(dir.pathname.length);
    if (!rest || rest.includes('/')) return;
    let file;
    try { file = decodeURIComponent(rest); } catch (e) { return; }
    if (file.includes('/') || file.includes('\\')) return;
    if (!/\.(jpe?g|png|webp|gif|avif)$/i.test(file)) return;
    const url = u.origin + u.pathname;
    if (seen.has(url)) return;
    seen.add(url);
    out.push({ name: file.replace(/\.[^.]+$/, ''), url });
  });
  return out.sort((x, y) => x.name.localeCompare(y.name));
}

// Show the listed presets, or the note, unless the New dialog closed or a newer listing started.
function onListed(list, id) {
  if (!newDialog.open || id !== listId) return;
  if (!list.length) {
    $('preset-note').textContent = 'No preset pictures found.';
    $('preset-note').hidden = false;
    return;
  }
  list.forEach((item) => {
    const opt = document.createElement('option');
    opt.value = item.url;
    opt.textContent = item.name;
    $('preset').appendChild(opt);
  });
  $('preset-row').hidden = false;
}

// Open the crop dialog for a decoded image, unless the New dialog closed or a newer decode started.
function onDecoded(bmp, id, r, c, name) {
  if (!newDialog.open || id !== decodeId) { bmp.close(); return; }
  newDialog.close();
  openCrop(bmp, r, c, name);
}

// Report an undecodable file in the New dialog, unless it closed or a newer decode started.
function onRejected(id) {
  if (!newDialog.open || id !== decodeId) return;
  $('new-start').disabled = false;
  $('new-error').textContent = 'That file is not an image.';
  $('new-error').hidden = false;
}

// Return the crop rectangle for state c (cover base, zoom, centre clamped inside the image), clamping c's centre.
function cropRect(c) {
  const W = c.bmp.width, H = c.bmp.height, A = c.cols / c.rows;
  const wide = W / H >= A;
  const cw = (wide ? H * A : W) / c.z, ch = (wide ? H : W / A) / c.z;
  c.cx = Math.min(Math.max(c.cx, cw / 2), W - cw / 2);
  c.cy = Math.min(Math.max(c.cy, ch / 2), H - ch / 2);
  return { sx: c.cx - cw / 2, sy: c.cy - ch / 2, cw, ch };
}

// Open the crop dialog for bmp at r rows by c columns: zoom 1, centred, view sized after the dialog is shown.
function openCrop(bmp, r, c, name) {
  crop = { bmp, name, rows: r, cols: c, z: 1, cx: bmp.width / 2, cy: bmp.height / 2, vw: 0, vh: 0 };
  dragFrom = null;
  cropZoom.value = '1';
  cropDialog.showModal();
  const cs = getComputedStyle(cropDialog);
  const A = c / r;
  const maxW = Math.min(cropDialog.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), 420);
  const maxH = Math.min(360, window.innerHeight / 2);
  crop.vw = Math.max(1, Math.floor(Math.min(maxW, maxH * A)));
  crop.vh = Math.max(1, Math.round(crop.vw / A));
  const dpr = window.devicePixelRatio || 1;
  cropView.style.width = crop.vw + 'px';
  cropView.style.height = crop.vh + 'px';
  cropView.width = Math.round(crop.vw * dpr);
  cropView.height = Math.round(crop.vh * dpr);
  drawCrop();
}

// Paint the crop rectangle into the view, then the white cut lines on exact backing pixels.
function drawCrop() {
  const ctx = cropView.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const r = cropRect(crop);
  const t = Math.max(1, Math.round(dpr));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cropView.width, cropView.height);
  ctx.drawImage(crop.bmp, r.sx, r.sy, r.cw, r.ch, 0, 0, cropView.width, cropView.height);
  ctx.fillStyle = '#fff';
  for (let k = 1; k < crop.cols; k++) ctx.fillRect(Math.round(k * crop.vw * dpr / crop.cols), 0, t, cropView.height);
  for (let k = 1; k < crop.rows; k++) ctx.fillRect(0, Math.round(k * crop.vh * dpr / crop.rows), cropView.width, t);
}

// Apply a drag of (dx, dy) CSS pixels to the crop centre (the image follows the pointer) and redraw.
function moveCrop(dx, dy) {
  const r = cropRect(crop);
  crop.cx -= dx * r.cw / crop.vw;
  crop.cy -= dy * r.ch / crop.vh;
  drawCrop();
}

// Cut the crop rectangle of bmp into one 128px canvas per tile value 1..rows*cols-1.
function cutImage(bmp, r, rowCount, colCount) {
  const out = [null];
  const tw = r.cw / colCount, th = r.ch / rowCount;
  for (let v = 1; v < rowCount * colCount; v++) {
    const piece = document.createElement('canvas');
    piece.width = 128;
    piece.height = 128;
    const col = (v - 1) % colCount, row = Math.floor((v - 1) / colCount);
    piece.getContext('2d').drawImage(bmp, r.sx + col * tw, r.sy + row * th, tw, th, 0, 0, 128, 128);
    out.push(piece);
  }
  return out;
}

// Adopt the cropped image: cut the pieces, close the dialog and start a solved, unshuffled puzzle.
function cropDone() {
  const c = crop;
  const rect = cropRect(c);
  const cut = cutImage(c.bmp, rect, c.rows, c.cols);
  if (image && image !== c.bmp) image.close();
  image = c.bmp;
  pieces = cut;
  picture = rect;
  caption = c.name;
  cropDialog.close();
  setSize(c.rows, c.cols);
}

$('new').addEventListener('click', openNew);
$('new-start').addEventListener('click', startNew);
$('new-cancel').addEventListener('click', () => newDialog.close());
newDialog.addEventListener('close', () => { decodeId++; $('new-start').disabled = false; previewId++; setPreview(null); });
$('image-file').addEventListener('change', () => { if ($('image-file').files.length) { $('kind-image').checked = true; $('preset').value = ''; } loadPreview(); });
$('preset').addEventListener('change', () => { if ($('preset').value) { $('kind-image').checked = true; $('image-file').value = ''; } loadPreview(); });
for (const id of ['rows', 'cols']) $(id).addEventListener('change', () => { sized = true; drawPreview(); });
for (const id of ['kind-numbers', 'kind-image']) $(id).addEventListener('change', drawPreview);
$('crop-cancel').addEventListener('click', () => cropDialog.close());
$('crop-done').addEventListener('click', cropDone);
$('crop-centre').addEventListener('click', () => { crop.cx = crop.bmp.width / 2; crop.cy = crop.bmp.height / 2; drawCrop(); });
cropZoom.addEventListener('input', () => { crop.z = Number(cropZoom.value); drawCrop(); });
cropDialog.addEventListener('close', () => {
  if (crop && crop.bmp !== image) crop.bmp.close();
  crop = null;
});
cropView.addEventListener('pointerdown', (e) => { cropView.setPointerCapture(e.pointerId); dragFrom = { x: e.clientX, y: e.clientY }; });
cropView.addEventListener('pointermove', (e) => {
  if (!dragFrom) return;
  moveCrop(e.clientX - dragFrom.x, e.clientY - dragFrom.y);
  dragFrom = { x: e.clientX, y: e.clientY };
});
cropView.addEventListener('pointerup', () => { dragFrom = null; });
cropView.addEventListener('pointercancel', () => { dragFrom = null; });
cropView.addEventListener('keydown', (e) => {
  const step = { ArrowLeft: [-0.05, 0], ArrowRight: [0.05, 0], ArrowUp: [0, -0.05], ArrowDown: [0, 0.05] }[e.key];
  if (!step) return;
  e.preventDefault();
  moveCrop(step[0] * crop.vw, step[1] * crop.vh);
});

const GRID_DEFAULT = { min: 3, max: 10 }; // the shipped settings.json range, used when it cannot be read
const GRID_LIMIT = { min: 3, max: 12 }; // hard bounds that keep tiles usable at 360px

// Return the offered grid range from parsed settings, using the default for each missing or bad value.
function gridRange(s) {
  const ok = (v) => Number.isInteger(v) && v >= GRID_LIMIT.min && v <= GRID_LIMIT.max;
  const pick = (dim) => {
    const d = s && s.grid && s.grid[dim];
    const min = d && ok(d.min) ? d.min : GRID_DEFAULT.min;
    const max = d && ok(d.max) ? d.max : GRID_DEFAULT.max;
    return min <= max ? { min, max } : { min: GRID_DEFAULT.min, max: GRID_DEFAULT.max };
  };
  return { rows: pick('rows'), cols: pick('columns') };
}

// Offer exactly range next in the Rows and Columns selects; if the game lies outside it, start numbers at the nearest size.
function applyRange(next) {
  if (range && JSON.stringify(range) === JSON.stringify(next)) return;
  range = next;
  const near = (v, d) => Math.min(Math.max(v, d.min), d.max);
  const r2 = near(rows, next.rows), c2 = near(cols, next.cols);
  if (r2 !== rows || c2 !== cols) {
    if (image && !(crop && crop.bmp === image)) image.close();
    image = null;
    pieces = null;
    setSize(r2, c2);
  }
  for (const [id, d, cur] of [['rows', next.rows, rows], ['cols', next.cols, cols]]) {
    const sel = $(id), picked = Number(sel.value);
    sel.innerHTML = '';
    for (let v = d.min; v <= d.max; v++) sel.add(new Option(String(v), String(v)));
    sel.value = String(picked >= d.min && picked <= d.max ? picked : cur);
  }
}

// Read settings.json from the page's own server; resolve null on file:// or when it is missing or not valid JSON.
function loadSettings() {
  if (location.protocol === 'file:') return Promise.resolve(null);
  return fetch('settings.json', { cache: 'no-store', redirect: 'error' })
    .then((res) => (res.ok ? res.json() : null))
    .catch(() => null);
}

applyRange(gridRange(null));
render();
const settingsReady = loadSettings().then((s) => applyRange(gridRange(s))).then(() => { if (flipped) drawBack(); if (newDialog.open) drawPreview(); });

// Turn the board over: show its back (the solved puzzle in greyscale) or the front again. Game state is untouched.
function flip() {
  flipped = !flipped;
  if (flipped) drawBack();
  $('plate').classList.toggle('flipped', flipped);
  $('frame').inert = flipped;
  $('back').inert = !flipped;
  $('flip').setAttribute('aria-pressed', String(flipped));
  $('new').disabled = flipped;
  $('shuffle').disabled = flipped;
}

// Paint the back for the current puzzle, fitted to the plate: the whole cropped picture or the solved number grid, and its caption.
function drawBack() {
  const isImage = !!(image && pieces);
  const back = $('back'), cv = $('back-picture'), grid = $('back-grid'), cap = $('back-caption');
  cap.textContent = isImage ? caption : 'Shuffle ' + rows + '×' + cols;
  cv.hidden = !isImage;
  grid.hidden = isImage;
  const cs = getComputedStyle(back);
  const freeW = back.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const freeH = back.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - cap.offsetHeight - parseFloat(cs.rowGap);
  const A = cols / rows;
  const w = Math.max(1, Math.floor(Math.min(freeW, freeH * A)));
  const h = Math.max(1, Math.floor(w / A));
  if (isImage) {
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    const g = cv.getContext('2d', { willReadFrequently: true });
    g.drawImage(image, picture.sx, picture.sy, picture.cw, picture.ch, 0, 0, cv.width, cv.height);
    greyscale(g, cv.width, cv.height);
  } else {
    grid.style.width = w + 'px';
    grid.style.height = h + 'px';
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    grid.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
    grid.style.fontSize = (0.42 * w / cols) + 'px';
    grid.replaceChildren();
    for (let i = 1; i <= rows * cols; i++) {
      const cell = document.createElement('div');
      cell.className = i === rows * cols ? 'back-cell empty' : 'back-cell';
      cell.textContent = i === rows * cols ? '' : i;
      grid.appendChild(cell);
    }
  }
}

// Replace each pixel with its Rec. 601 luma, so the back prints the solution in greyscale like a Pussycat back.
function greyscale(g, w, h) {
  const img = g.getImageData(0, 0, w, h);
  const p = img.data;
  for (let i = 0; i < p.length; i += 4) p[i] = p[i + 1] = p[i + 2] = Math.round(0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]);
  g.putImageData(img, 0, 0);
}

$('flip').addEventListener('click', flip);
window.addEventListener('resize', () => { if (flipped) drawBack(); if (newDialog.open) drawPreview(); });

// Fetch a preset picture as a Blob, refusing redirects so nothing leaves the page's origin.
function presetBlob(url) {
  return fetch(url, { redirect: 'error' }).then((res) => (res.ok ? res.blob() : Promise.reject(new Error('HTTP ' + res.status))));
}

// Return [rows, cols] closest in shape to a w x h picture: among sizes within a 5% ratio band of the closest, the one with a tile count nearest the current game's.
function recommend(w, h) {
  const want = Math.log(w / h);
  const sizes = [];
  for (let r = range.rows.min; r <= range.rows.max; r++) {
    for (let c = range.cols.min; c <= range.cols.max; c++) sizes.push({ r, c, e: Math.abs(Math.log(c / r) - want) });
  }
  const best = Math.min(...sizes.map((s) => s.e));
  const near = sizes.filter((s) => s.e <= best + 0.05 + 1e-9);
  const dist = (s) => Math.abs(s.r * s.c - rows * cols);
  near.sort((x, y) => dist(x) - dist(y) || x.r * x.c - y.r * y.c || x.r - y.r);
  return [near[0].r, near[0].c];
}

// Replace the preview picture, revoking the object URL of the one it replaces.
function setPreview(p) {
  if (preview) URL.revokeObjectURL(preview.url);
  preview = p;
}

// Load the picture chosen in the New dialog (preset or file) for the preview; once loaded, recommend its size unless the player chose one.
function loadPreview() {
  const id = ++previewId;
  setPreview(null);
  const url = $('preset').value, file = $('image-file').files[0];
  previewStatus = url || file ? 'loading' : 'none';
  drawPreview();
  if (!url && !file) return;
  (url ? presetBlob(url) : Promise.resolve(file)).then((b) => {
    if (id !== previewId || !newDialog.open) return null;
    const img = new Image();
    const src = URL.createObjectURL(b);
    img.src = src;
    return img.decode().then(() => {
      if (img.naturalWidth > 0 && img.naturalHeight > 0) return { img, url: src };
      URL.revokeObjectURL(src);
      throw new Error('no natural size');
    }, (e) => { URL.revokeObjectURL(src); throw e; });
  }).then((p) => {
    if (!p) return;
    if (id !== previewId || !newDialog.open) { URL.revokeObjectURL(p.url); return; }
    setPreview(p);
    previewStatus = 'ready';
    if (!sized && $('kind-image').checked) {
      const [r, c] = recommend(p.img.naturalWidth, p.img.naturalHeight);
      $('rows').value = String(r);
      $('cols').value = String(c);
    }
    drawPreview();
  }, () => { if (id === previewId) { previewStatus = 'failed'; drawPreview(); } });
}

// Paint the preview: the whole picture fitted to the dialog, the default crop for the chosen size lit with its cut lines, the overflow dimmed.
function drawPreview() {
  const cv = $('new-preview');
  const chosen = Boolean($('preset').value || $('image-file').files.length);
  const pic = !$('kind-image').checked ? null : chosen ? (preview && preview.img) : image;
  cv.hidden = !pic;
  cv.dataset.state = chosen ? previewStatus : pic ? 'current' : 'none';
  if (!pic) return;
  const W = pic.naturalWidth || pic.width, H = pic.naturalHeight || pic.height;
  const r = Number($('rows').value), c = Number($('cols').value);
  const cs = getComputedStyle(newDialog);
  const boxW = Math.min(newDialog.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), 400);
  const boxH = Math.min(200, window.innerHeight / 4);
  const k = Math.min(boxW / W, boxH / H);
  const vw = Math.max(1, Math.floor(W * k)), vh = Math.max(1, Math.floor(H * k));
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = vw + 'px';
  cv.style.height = vh + 'px';
  cv.width = Math.round(vw * dpr);
  cv.height = Math.round(vh * dpr);
  const g = cv.getContext('2d');
  g.drawImage(pic, 0, 0, cv.width, cv.height);
  const q = cropRect({ bmp: { width: W, height: H }, rows: r, cols: c, z: 1, cx: W / 2, cy: H / 2 });
  const s = cv.width / W;
  const x0 = Math.round(q.sx * s), y0 = Math.round(q.sy * s), x1 = Math.round((q.sx + q.cw) * s), y1 = Math.round((q.sy + q.ch) * s);
  g.fillStyle = 'rgba(0, 0, 0, 0.6)';
  g.fillRect(0, 0, cv.width, y0);
  g.fillRect(0, y1, cv.width, cv.height - y1);
  g.fillRect(0, y0, x0, y1 - y0);
  g.fillRect(x1, y0, cv.width - x1, y1 - y0);
  const t = Math.max(1, Math.round(dpr));
  g.fillStyle = '#fff';
  for (let i = 1; i < c; i++) g.fillRect(Math.round(x0 + i * (x1 - x0) / c), y0, t, y1 - y0);
  for (let i = 1; i < r; i++) g.fillRect(x0, Math.round(y0 + i * (y1 - y0) / r), x1 - x0, t);
}
</script>
